/* SWIM V2 — interface claire, compacte, inspiration iOS */
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:#17212e;background:#f5f6f8;color-scheme:light}
body{background:#f5f6f8;letter-spacing:-.012em}
header{background:rgba(250,251,253,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid #e7e9ed;padding:11px 18px}
header h1{font-size:19px;font-weight:750;letter-spacing:-.045em}

main{max-width:640px;padding:17px 13px 96px}
h2{font-size:21px;letter-spacing:-.035em;margin:7px 0 11px;font-weight:760}
h3{font-size:15px;font-weight:730;margin:0 0 7px}
p{line-height:1.4;margin:8px 0 11px}
small,.muted{color:#7b8491}
.panel,.card{background:#fff;border:1px solid #eaecf0;box-shadow:0 2px 12px rgba(25,35,50,.035);border-radius:17px;padding:13px;margin:0 0 10px}
.card{background:#fff;border:1px solid #e8ebef}
.card h2{font-size:17px;margin:9px 0 5px}
.card p{font-size:12px;line-height:1.35;margin:5px 0}
.row{gap:7px}
.stack{gap:7px}
.grid{gap:7px;margin-bottom:12px}
.metric{background:#fff;border:1px solid #e8ebef;border-radius:14px;padding:12px 4px}
.metric strong{font-size:21px;color:#152b45;letter-spacing:-.04em}
.metric small{font-size:10px}
.pill{background:#e9f3ff;color:#2167a5;padding:4px 9px;font-weight:700;font-size:10px;border-radius:999px}
#syncBadge{background:#e9f6ef;color:#247b50}
.btn{background:#1479dc;color:#fff;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;min-height:36px}
.btn.secondary{background:#eef2f6;color:#314255}
.btn.danger{background:#ffebed;color:#bb3445}
.actions{gap:6px}
.actions .btn{flex:0 0 auto}
input,select,textarea{background:#f9fafc;border:1px solid #dfe4ea;color:#17212e;border-radius:10px;padding:10px;font-size:14px;min-height:40px}
label{color:#586678;font-size:12px;font-weight:650}
.field{margin-bottom:10px}
.tabs{background:rgba(255,255,255,.97);border-top:1px solid #e4e8ed;box-shadow:0 -3px 18px rgba(30,45,60,.045);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.tabs button{color:#8a929e;padding:9px 2px 7px;font-size:10px;font-weight:650}
.tabs button.active{color:#1479dc;background:transparent}
.tabs span{font-size:22px;margin-bottom:2px}
.exercise{grid-template-columns:29px 1fr auto;gap:8px;padding:8px 0;border-color:#eef0f3}
.marker{background:#eaf3fc;color:#2676bb;border-radius:8px;padding:7px 0;font-size:12px}
.distance{font-size:13px;font-weight:750}
.note{color:#6a7583;font-size:12px;line-height:1.4}
.notice{background:#eef6ff;color:#3b6386;border:1px solid #dceafa;border-radius:12px;padding:11px;font-size:12px}
.empty{color:#7b8491}
.viewer{min-height:65vh}
.viewer .exercise{padding:12px 0}
.viewer .distance{font-size:16px}
.viewer .note{font-size:14px}
.viewer h2{font-size:23px}
hr{border-color:#e8ebef}
a{color:#1479dc}
@media(max-width:390px){main{padding-left:10px;padding-right:10px}.panel,.card{padding:11px}.actions .btn{font-size:11px;padding:8px 9px}.tabs button{font-size:9px}}

function compactSteps(c){
 let parts=Array.isArray(c.parts)?c.parts:[],steps=[];
 for(let p of parts){let gid=p.groupId||('legacy:'+p.tag);let prev=steps[steps.length-1];if(!prev||prev.id!==gid){prev={id:gid,tag:p.tag,parts:[]};steps.push(prev)}prev.parts.push(p)}
 return steps.map((step,idx)=>{
  let rows=[];for(let p of step.parts){let meters=Number(p.unitMeters)||Number(p.meters)||0,gear=Array.isArray(p.gear)?p.gear:[],zone=p.zone||'—',note=String(p.description||'').trim();
   let key=JSON.stringify([meters,zone,[...gear].sort(),note]);let prev=rows[rows.length-1];if(prev&&prev.key===key){prev.count++;prev.total+=meters}else rows.push({key,count:1,total:meters,meters,zone,note,gear})}
  let distance=step.parts.reduce((n,p)=>n+(Number(p.meters)||0),0);
  return `<section class="compact-step"><div class="compact-step-heading"><strong>${esc(step.tag==='E'?'Échauffement':step.tag==='R'?'Récupération':'Step '+(idx+1))}</strong><b>${fmt(distance)} m</b></div><div class="compact-step-rows">${rows.map(r=>`<div class="compact-row"><div class="compact-row-line"><b>${r.count} × ${fmt(r.meters)} m</b><span class="compact-zone">${esc(r.zone)}</span><span class="compact-gears">${r.gear.filter(g=>GEAR_ICONS[g]).map(g=>`<img src="${GEAR_ICONS[g]}" title="${esc(g)}" alt="${esc(g)}">`).join('')}</span><span class="compact-note">${esc(r.note)}</span></div></div>`).join('')}</div></section>`
 }).join('')}

function inferredUnits(p){if(p.sets!=null&&p.reps!=null&&p.unitMeters!=null)return [p.sets,p.reps,p.unitMeters];let m=String(p.description||'').match(/(?:^|\s)(\d+)\s*[x×]\s*(\d+)\s*m\b/i);if(m&&Number(m[1])*Number(m[2])===Number(p.meters))return [1,Number(m[1]),Number(m[2])];return [1,1,Number(p.meters)||0]}

function editorLine(p,i){let unit=Number(p.unitMeters)||Number(p.meters)||100;return `<div class="visual-rep" data-row="${i}"><div class="visual-main"><span class="rep-count">${i+1}.</span><span class="rep-mult">1 ×</span><input aria-label="Distance en mètres" type="number" min="1" step="25" data-part="${i}" data-prop="unitMeters" value="${unit}"><span class="rep-unit">m</span><button type="button" class="zone-cycle" data-act="cyclezone:${i}" title="Changer la zone">${esc(p.zone||'—')}</button>${gearButtons(p,i)}</div><div class="visual-note"><input data-part="${i}" data-prop="description" placeholder="Remarque / consigne pour cette répétition" value="${esc(p.description||'')}"><button type="button" class="rep-action" data-act="copypart:${i}" title="Dupliquer cette ligne">⧉</button><button type="button" class="rep-action" data-act="delpart:${i}" title="Supprimer cette ligne">×</button></div></div>`}

function editorDraft(){captureParts();let old=state.cards.find(x=>x.id===editId);return {id:old?.id||'preview',category:$('editCat')?.value||'Personnalisée',title:$('editTitle')?.value||'Nouvelle séance',code:old?.code||'',description:$('editDesc')?.value||'',parts:structuredClone(editParts)}}

function drawEditor(c){normalizeTags();let preserved=window.__swimEditorFields||null;let title=preserved?.title??c?.title??'Nouvelle séance',cat=preserved?.category??c?.category??CATS[0],desc=preserved?.description??c?.description??'';let groups=editorGroups();$('app').innerHTML=`<div class="visual-editor"><div class="visual-editor-heading"><h2>${c?'Modifier':'Créer'} une carte</h2><span>Édition directe de la fiche</span></div><div class="panel editor-panel"><div class="editor-basics"><div class="field"><label>Titre</label><input id="editTitle" value="${esc(title)}"></div><div class="field"><label>Catégorie</label><select id="editCat">${CATS.map(x=>`<option ${cat===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Objectif de la séance</label><textarea id="editDesc" rows="2">${esc(desc)}</textarea></div><div class="visual-top"><b>SETS ET RÉPÉTITIONS</b><button type="button" class="preview-button" data-act="togglepreview">👁 Prévisualiser la carte complète</button></div><div id="fullCardPreview" class="full-card-preview" hidden></div><div id="parts">${groups.map((g,i)=>editGroup(g,i,groups)).join('')}</div><button type="button" class="add-set" data-act="addgroup">＋ Ajouter un Set</button><div class="edit-total">DISTANCE TOTALE <b><span id="editTotal">${fmt(editParts.reduce((a,p)=>a+Number(p.unitMeters||p.meters||0),0))}</span> m</b></div><div class="editor-bottom-actions">${btn('Enregistrer la carte','savecard','')}${btn('Annuler','close')}</div></div></div>`;window.__swimEditorFields=null;}

function parseTime(s){let a=String(s||'').trim().replace(',', '.');if(!a)return null;let p=a.split(':');let n=p.length===2?Number(p[0])*60+Number(p[1]):Number(a);return Number.isFinite(n)&&n>0?n:null}

function perfChart(items){let data=items.filter(s=>pace(s)!=null);if(!data.length)return '<p class="mini-hint">Enregistre une séance avec une allure au 100 m pour voir le graphique.</p>';let W=340,H=180,L=42,R=12,T=18,B=36,values=data.flatMap(s=>[pace(s),maxPace(s)].filter(x=>x!=null)),low=Math.max(0,Math.floor(Math.min(...values)/5)*5-5),high=Math.ceil(Math.max(...values)/5)*5+5,range=high-low||1;let X=i=>L+(W-L-R)*(data.length===1?.5:i/(data.length-1)),Y=v=>T+(H-T-B)*(high-v)/range;let grid=[0,.25,.5,.75,1].map(t=>{let v=low+range*t,y=Y(v);return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#d7e6ed"/><text x="${L-5}" y="${y+3}" font-size="9" text-anchor="end" fill="#51728a">${showTime(v)}</text>`}).join('');let line=(fn,color)=>{let pts=data.map((s,i)=>({x:X(i),y:fn(s)==null?null:Y(fn(s))}));let segments=[],cur=[];for(let p of pts){if(p.y==null){if(cur.length)segments.push(cur);cur=[]}else cur.push(p)}if(cur.length)segments.push(cur);return segments.map(seg=>`<polyline points="${seg.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${color}" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>`).join('')+pts.filter(p=>p.y!=null).map(p=>`<circle class="perf-point" data-session="${esc(data[pts.indexOf(p)].id)}" data-kind="${fn===pace?'avg':'max'}" tabindex="0" role="button" aria-label="Voir la séance du ${esc(data[pts.indexOf(p)].date)}" cx="${p.x}" cy="${p.y}" r="5.5" fill="${color}"/>`).join('')};let labels=data.map((s,i)=>i===0||i===data.length-1||data.length<=5?`<text x="${X(i)}" y="${H-13}" font-size="9" fill="#56768b" text-anchor="middle">${s.date.slice(5).split('-').reverse().join('/')}</text>`:'').join('');return `<svg class="perf-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution des allures au 100 mètres"><g>${grid}${line(pace,'#008fc6')}${line(maxPace,'#ee8a35')}${labels}</g></svg><div class="mini-hint">🔵 Moyenne /100 m · 🟠 Maximum /100 m (temps le plus lent). Plus bas = plus rapide. Les valeurs max non renseignée async function handleImport(file){let data;try{if(file.size>10*1024*1024)throw Error('Fichier trop volumineux (10 Mo maximum).');data=JSON.parse(await file.text());if(importMode==='all'){if(data.kind!=='swim-backup'||!Array.isArray(data.data?.cards)||!Array.isArray(data.data?.sessions)||!Array.isArray(data.data?.plans)||!data.data.settings||!data.data.cards.every(validCard))throw Error('Sauvegarde non reconnue');if(!confirm('Remplacer TOUTES les données locales par cette sauvegarde ?'))return;state=data.data;await save();alert('Sauvegarde restaurée.')}else{let cards=data.kind==='swim-cards'?data.cards:data.kind==='swim-backup'?data.data?.cards:null;if(!Array.isArray(cards)||!cards.every(validCard))throw Error('Format de cartes invalide');let added=0,updated=0,skipped=0;let collisions=cards.filter(c=>state.cards.some(x=>x.id===c.id));let replace=collisions.length?confirm(`${collisions.length} carte(s) portent déjà le même identifiant. OK : mettre à jour les cartes existantes. Annuler : ignorer les doublons.`):false;for(let c of cards){let idx=state.cards.findIndex(x=>x.id===c.id);if(idx<0){state.cards.push(c);added++}else if(replace){state.cards[idx]=c;updated++}else skipped++}await save();alert(`Import terminé : ${added} ajoutée(s), ${updated} mise(s) à jour, ${skipped} ignorée(s).`)}viewer=false;render()}catch(e){alert('Import impossible : '+e.message)}finally{$('importFile').value=''}}
